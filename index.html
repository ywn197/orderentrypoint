<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Redirect</title>
</head>
<body>
  <script>
    const URL = 'https://script.google.com/macros/s/AKfycby7CzSmEbS3V86P5x0w6elKpKB7PhCuRji4O4rxPagnyti61ADCvJKNu_00vxj4YRdW/exec';
    const query = window.location.search; // 先頭の ? を含むクエリ文字列

    // クエリが存在する場合だけ末尾に付けて遷移
    if (query && !(["/",".","http","https"].some(keyword => query.includes(keyword))) ) {
      location.href = URL + query;
    }
  </script>
</body>
</html>
